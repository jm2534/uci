[package]
name = "termchess"
authors = ["jm2534"]
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "uci"

[[bin]]
name = "uci"
path = "src/main.rs"

[[bin]]
name = "termchess"
path = "src/termchess.rs"
required-features = ["terminal"]


[dependencies]
anyhow = "1.0.95"
enum-iterator = "2.1.0"
paste = "1.0.15"
regex = "1.11.1"
thiserror = "2.0.9"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"], optional = true }
crossterm = { version = "0.29.0", optional = true }
inquire = { version = "0.9.1", optional = true }
tracing-appender = { version = "0.2.4", optional = true }


[features]
terminal = ["dep:inquire", "dep:crossterm"]
logging = ["dep:tracing-subscriber", "dep:tracing-appender"]

[profile.release]
opt-level = 3        # Maximum optimization level
lto = "fat"          # Enable full Link Time Optimization
codegen-units = 1    # Reduce parallel code generation for better optimization
# panic = "abort"      # Reduce binary size and potential overhead
strip = true         # Strip symbols from binary to reduce size

[dev-dependencies]
criterion = "0.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[[bench]]
name = "uci-bench"
harness = false
