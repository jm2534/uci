[package]
name = "termchess"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "uci"

[[bin]]
name = "uci"
path = "src/main.rs"

[[bin]]
name = "termchess"
path = "src/term.rs"
required-features = ["terminal"]


[dependencies]
anyhow = "1.0.95"
enum-iterator = "2.1.0"
inquire = {version = "0.9.1", optional = true}
paste = "1.0.15"
regex = "1.11.1"
thiserror = "2.0.9"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }


[features]
terminal = ["dep:inquire"]
